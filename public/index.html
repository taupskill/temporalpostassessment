<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juniper Salon</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Juniper Salon</p>
      <h1>Filling last-minute openings, gently.</h1>
      <p class="lead muted">
        Waitlisted clients get a personal link by text. Staff manage openings here.
      </p>

      <form id="staff-login" class="card">
        <h2 class="card-title">Staff credentials</h2>
        <label>Name
          <input name="username" autocomplete="username" autocapitalize="none" placeholder="lena or carla" required />
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error" hidden></p>
        <button type="submit">Sign in to staff view</button>
      </form>
    </main>
    <script src="/index.js"></script>
  </body>
</html>
